services:
  postgres:
    image: postgres:16-alpine
    container_name: conecta-campus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: conecta
      POSTGRES_PASSWORD: conecta
      POSTGRES_DB: conecta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
